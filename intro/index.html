async function open_(answer){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(answer.trim()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(plain);

async function attempt(answer, quiet){
  try {
    const html = await open_(answer);
    try { sessionStorage.setItem("intro-answer", answer.trim()); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    if (!quiet) document.getElementById("err").textContent = "That's not it. Try again.";
  }
