document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); attempt(document.getElementById("a").value, false); });
let saved = null; try { saved = sessionStorage.getItem("intro-answer"); } catch (e) {}
if (saved) attempt(saved, true);
